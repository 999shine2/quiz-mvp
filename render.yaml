services:
  - type: web
    name: quiz-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: SKIP_MONGO
        value: "true"
      - key: DATA_DIR
        value: "./data"
      - key: GEMINI_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: YOUTUBE_PROXY_URL
        sync: false

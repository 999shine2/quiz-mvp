services:
  - type: web
    name: insighter
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: SKIP_MONGO
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: YOUTUBE_PROXY_URL
        sync: false
      - key: PORT
        value: "3001"

services:
  - type: web
    name: quiz-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SKIP_MONGO
        value: "true"
      - key: PORT
        value: "3001"
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_PROXY_URL
        sync: false
